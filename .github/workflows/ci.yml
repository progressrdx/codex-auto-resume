name: Isolated checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Isolated regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify version and repository hygiene
        run: python scripts/verify_release.py
      - name: Python regression (isolated fake services only)
        run: python -m unittest discover -s tests -v
      - name: Node regression (no real App or business task)
        run: node --test tests/test_ui.cjs
      - name: Compile Python modules
        run: python -m compileall -q codex_resume
      - name: Check browser JavaScript syntax
        run: node --check codex_resume/static/app.js
